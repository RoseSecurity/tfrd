name: Test tfrd

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Build and test trfd
        run: |
          echo "Building tfrd..."
          make build

          echo "Running trfd..."
          build/tfrd --init examples > output.txt

          # Validate that expected elements are present
          echo "Validating output..."
          grep -q "local_file.example" output.txt || { echo "Missing local_file"; exit 1; }

          echo "✅ Validation passed: Output contains expected elements"
